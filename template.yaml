AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ecommerce-api

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref ProductsTable
Resources:
  MyApi:
    Type: AWS::Serverless::Api
    Properties:
      TracingEnabled: true
      StageName: Prod
      Cors: "'*'"
      Auth:
        DefaultAuthorizer: MyCognitoAuthorizer
        Authorizers:
          MyCognitoAuthorizer:
            UserPoolArn: !GetAtt MyCognitoUserPool.Arn
  CreateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/createProduct.lambdaHandler
      Architectures:
        - x86_64
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ProductsTable
      Events:
        CreateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref MyApi
            Path: /products
            Method: post
  GetProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/getProducts.lambdaHandler
      Architectures:
        - x86_64
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
      Events:
        getProducts:
          Type: Api
          Properties:
            RestApiId: !Ref MyApi
            Path: /products
            Method: get
  GetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/getProduct.lambdaHandler   # not getProducts
      Architectures:
        - x86_64
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
      Events:
        GetProduct:
          Type: Api
          Properties:
            RestApiId: !Ref MyApi
            Path: /products/{id}
            Method: get
  UpdateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/updateProduct.lambdaHandler
      Architectures:
        - x86_64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
      Events:
        updateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref MyApi
            Path: /products/{id}
            Method: put
  DeleteProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/deleteProduct.lambdaHandler
      Architectures:
        - x86_64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
      Events:
        deleteProduct:
          Type: Api
          Properties:
            RestApiId: !Ref MyApi
            Path: /products/{id}
            Method: delete 
  MyCognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      UsernameAttributes:
        - email
      Schema:
        - AttributeDataType: String
          Name: email
          Required: false
  MyCognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref MyCognitoUserPool
      ClientName: !Sub "${AWS::StackName}-client"
      ExplicitAuthFlows: 
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-products"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
  ApiDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-dashboard"
      DashboardBody: !Sub | 
        {
          "widgets": [
            {
              "type": "metric",
              "properties": {
                "title": "API Invocations",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${CreateProductFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${GetProductsFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${GetProductFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${UpdateProductFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${DeleteProductFunction}"]
                ],
                "period": 300,
                "stat": "Sum"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "API Errors",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${CreateProductFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${GetProductsFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${GetProductFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${UpdateProductFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${DeleteProductFunction}"]
                ],
                "period": 300,
                "stat": "Sum"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "API Latency",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${CreateProductFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${GetProductsFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${GetProductFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${UpdateProductFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${DeleteProductFunction}"]
                ],
                "period": 300,
                "stat": "Average"
              }
            }
          ]
        }
  HighErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-high-errors"
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref CreateProductFunction
Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${MyApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/products/"
  CreateProductFunction:
    Description: "CreateProduct Lambda Function ARN"
    Value: !GetAtt CreateProductFunction.Arn
  UserPoolId:
    Value: !Ref MyCognitoUserPool
  UserPoolClientId:
    Value: !Ref MyCognitoUserPoolClient